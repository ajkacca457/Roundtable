[tool.poetry]
name = "server"
version = "0.1.0"
description = "CrewAI + FastAPI + Postgres backend"
authors = ["Avijit Karmaker <ajkacca@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
setuptools = "^68.0.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
SQLAlchemy = "^2.0.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
crewai = "^0.51.0"
langchain-openai = "^0.1.7"
pgvector = "^0.5.0"
psycopg2-binary = "^2.9.12"
google-genai = "^2.22.0"
clerk-backend-api = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
