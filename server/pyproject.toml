[tool.poetry]
name = "server"
version = "0.1.0"
description = "CrewAI + FastAPI + SQLite backend"
authors = ["Avijit Karmaker <ajkacca@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<=3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
SQLAlchemy = "^2.0.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
crewai = "^0.51.0"
langchain-openai = "^0.1.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
